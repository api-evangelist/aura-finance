description: Aura Finance is an employer-sponsored financial wellness platform that blends
  behavioral psychology with money management to help employees reach financial stability
  and peace of mind. The San Francisco fintech — a Techstars Economic Mobility 2023 company
  and an SEC-registered investment adviser (CRD 318940) — delivers goal-based automated
  investing, one-on-one financial coaching over chat, budgeting and saving tools, financial-literacy
  workshops, mindfulness exercises to reduce money stress, and a money-personality quiz,
  offered through a B2B2C model to organizations and their workforces. The company publishes
  no public developer program, API, or SDKs; its member application lives at web.aurafi.io.
